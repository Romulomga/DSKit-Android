# Lança uma versão quando uma tag x.y.z chega ao GitHub: confere que a tag é a VERSION_NAME, roda as mesmas
# checagens do desenvolvimento, cria a release com a seção do CHANGELOG e pede ao JitPack para compilar.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag igual à VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com VERSION_NAME=$version em gradle.properties."
            exit 1
          fi

      - name: Checagens
        # Sem o verifyRoborazzi: as screenshots são gravadas no macOS e o Linux renderiza fonte diferente.
        # O ATF continua rodando dentro do test.
        run: ./gradlew ktlint lint test :sample:assembleDebug publishToMavenLocal

      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Compilar no JitPack
        run: curl --silent --max-time 900 "https://jitpack.io/com/github/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/build.log" | tail -n 20
